name: Publish versioned site
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to redeploy
        required: true
permissions:
  contents: read
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release and successful CI for exact commit
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease > release-status.json
          test "$(jq -r '.isDraft' release-status.json)" = "false"
          BUILD_COMMIT="$(git rev-parse HEAD)"
          EXPECTED_TAG="$(python -c 'import tomllib;print("v"+tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "$EXPECTED_TAG"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BUILD_COMMIT" --jq '.workflow_runs | any(.conclusion == "success" and .event == "push")' | grep -qx true
          echo "BUILD_COMMIT=$BUILD_COMMIT" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: python scripts/build_site.py --output site-build --commit "$BUILD_COMMIT" --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
      - run: python scripts/check_site.py --directory site-build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact release
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
